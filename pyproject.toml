[project]
name = "coroner"
version = "0.1.0"
description = "Reads a trade log and reports what the profit rests on."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.5",
    "pandas==3.1.1",
    "matplotlib==3.11.2",
    "tzdata==2026.6",
]

[project.scripts]
coroner = "coroner.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
    "mypy==2.4.1",
    "pandas-stubs==3.1.0.261029",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coroner"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
